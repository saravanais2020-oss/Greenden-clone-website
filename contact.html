<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Greenden | Contact</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="font-sans">

  <!-- NAVBAR -->
  <nav class="bg-green-100 p-4 flex justify-between items-center shadow sticky top-0">
    <h1 class="text-2xl font-bold text-green-800">Greenden</h1>

    <ul class="hidden md:flex gap-6 text-gray-700 font-medium">
      <li><a href="index.html" class="hover:text-green-800">Home</a></li>
      <li><a href="product.html" class="hover:text-green-800">Products</a></li>
      <li><a href="contact.html" class="text-green-900 underline">Contact</a></li>
    </ul>
  </nav>

  <!-- CONTACT -->
  <section class="bg-green-50 p-8">
    <div class="max-w-xl mx-auto">
      <h2 class="text-3xl font-bold text-center mb-4">Contact Us</h2>
      <p class="text-center text-gray-600 mb-6">
        Have questions? We’d love to hear from you.
      </p>

      <form class="space-y-4">
        <div>
          <label class="block mb-1 font-medium">Email</label>
          <input
            type="email"
            placeholder="example@gmail.com"
            class="w-full border border-gray-400 rounded p-2"
          />
        </div>

        <div>
          <label class="block mb-1 font-medium">Subject</label>
          <input
            type="text"
            placeholder="Your subject"
            class="w-full border border-gray-400 rounded p-2"
          />
        </div>

        <div>
          <label class="block mb-1 font-medium">Message</label>
          <textarea
            rows="5"
            placeholder="Write your message..."
            class="w-full border border-gray-400 rounded p-2"
          ></textarea>
        </div>

        <button
          class="bg-green-800 text-white px-6 py-2 rounded hover:bg-green-900">
          Send Message
        </button>
      </form>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="bg-green-100 p-6 text-center">
    <h2 class="font-bold text-xl">Greenden</h2>
    <p class="text-sm text-gray-600">© 2026 Greenden.com</p>
  </footer>

</body>
</html>
