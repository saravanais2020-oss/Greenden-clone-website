<!DOCTYPE html>

<body class="font-sans">

    <ul class="hidden md:flex gap-6 text-gray-700 font-medium">

        <p class="text-green-700">$45</p>
      </div>

      <div class="border rounded p-3 hover:shadow-lg">
        <img src="./Images/B1 (7).jpg" class="w-64 h-64 object-cover rounded-lg">
